<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Interview Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.18), transparent 28%),
                        #020617;
            color: #e2e8f0;
        }
        .navbar, .card, .btn-outline-light {
            border-color: rgba(148, 163, 184, 0.18);
        }
        .navbar {
            backdrop-filter: blur(12px);
            background: rgba(15, 23, 42, 0.92);
        }
        .page-card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
        }
        .form-control, .form-check-input {
            background: #111827;
            border-color: rgba(148, 163, 184, 0.16);
            color: #e2e8f0;
        }
        .form-control:focus, .form-check-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.25);
        }
        .btn-primary {
            background: #0ea5e9;
            border-color: #0ea5e9;
        }
        .btn-primary:hover {
            background: #0284c7;
            border-color: #0369a1;
        }
        .text-muted {
            color: #94a3b8 !important;
        }
        .alert {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(148, 163, 184, 0.18);
            color: #e2e8f0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">AI Interview</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                {% if request.user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'practice_section' category_slug='aptitude' %}">Practice</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'accounts:logout' %}">Logout</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'accounts:register' %}">Register</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
<main class="py-5">
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
