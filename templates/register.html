
{% extends 'base.html' %}

{% block title %}Register - AI Interview Platform{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center align-items-center">

        <div class="col-lg-5 col-md-7">

            <div class="page-card rounded-4 p-4 p-md-5 shadow-lg">

                <!-- Header -->
                <div class="text-center mb-4">

                    <div class="mb-3">
                        <span class="badge rounded-pill px-3 py-2"
                              style="background: rgba(16,185,129,0.15);
                              color: #34d399;">
                            AI INTERVIEW PLATFORM
                        </span>
                    </div>

                    <h2 class="fw-bold mb-2">
                        Create Your <span style="color:#34d399;">Account</span>
                    </h2>

                    <p class="text-muted">
                        Start your journey towards interview success.
                    </p>

                </div>

                <!-- Register Form -->
                <form method="POST" class="d-grid gap-3">

                    {% csrf_token %}

                    <div>
                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <input
                            class="form-control form-control-lg"
                            type="text"
                            name="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required>
                    </div>

                    <div>
                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            class="form-control form-control-lg"
                            type="password"
                            name="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            required>
                    </div>

                    <button
                        class="btn btn-lg fw-bold mt-2"
                        type="submit"
                        style="background:#10b981;
                        color:#071b16;
                        border:none;">

                        Create Account
                    </button>

                </form>

                <!-- Login Link -->
                <div class="text-center mt-4">

                    <p class="text-muted mb-0">
                        Already have an account?

                        <a href="{% url 'accounts:login' %}"
                           class="text-decoration-none fw-bold"
                           style="color:#34d399;">

                            Login Here

                        </a>
                    </p>

                </div>

                <div class="text-center mt-4">
                    <small class="text-muted">
                        Learn. Practice. Get Hired.
                    </small>
                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
