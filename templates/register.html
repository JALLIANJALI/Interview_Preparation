{% extends 'base.html' %}

{% block title %}Register - AI Interview Platform{% endblock %}

{% block content %}
<div class="page-card rounded-4 p-5 mx-auto" style="max-width: 420px;">
    <h2 class="mb-4">Register</h2>
    <form method="POST" class="d-grid gap-3">
        {% csrf_token %}
        <input class="form-control form-control-lg" type="text" name="username" placeholder="Username" required>
        <input class="form-control form-control-lg" type="password" name="password" placeholder="Password" required>
        <button class="btn btn-primary btn-lg" type="submit">Register</button>
    </form>
    <p class="text-muted mt-4 mb-0">Already have an account? <a class="text-white" href="{% url 'accounts:login' %}">Login</a></p>
</div>
{% endblock %}
